<!-- tv-abstract-merge.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tony Vargas merged T and V logo">
  <defs>
    <!-- Patina → Green → Yellow gradient -->
    <linearGradient id="patinaGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5F9B8C"/>
      <stop offset="50%" stop-color="#A0C382"/>
      <stop offset="100%" stop-color="#FAC846"/>
    </linearGradient>
  </defs>

  <!--
    Composition:
    - One continuous path: vertical stem flows into descending arms
    - Top bar implied by smooth curve
    - Subtle tapering gives direction and elegance
  -->
  <path fill="url(#patinaGradient)" d="
    M 256 120
    C 248 150, 248 190, 252 230
    C 254 250, 260 260, 276 270
    C 300 286, 330 310, 360 345
    C 370 357, 370 365, 364 374
    C 356 386, 336 386, 320 368
    C 296 342, 276 320, 256 304
    C 236 320, 216 342, 192 368
    C 176 386, 156 386, 148 374
    C 142 365, 142 357, 152 345
    C 182 310, 212 286, 236 270
    C 252 260, 258 250, 260 230
    C 264 190, 264 150, 256 120
    Z" />
</svg>
